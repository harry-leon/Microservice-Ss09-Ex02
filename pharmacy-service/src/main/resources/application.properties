spring.application.name=pharmacy-service
server.port=8081

# Import configuration from Spring Cloud Config Server
# optional:configserver allows application to start with default fallback if Config Server is unavailable
spring.config.import=optional:configserver:http://localhost:8888

# Fallback default VAT rate if config server is not yet reached
pharmacy.vat-rate=0.08

# Actuator Endpoints Exposure: expose refresh and health
management.endpoints.web.exposure.include=health,info,refresh
management.endpoint.health.show-details=always
